name: release snapshot
description: Version every public package as a snapshot and publish it to npm through trusted publishing (OIDC)
inputs:
  tag:
    description: name of the dist-tag to release
    required: true
  gh-token:
    description: github token
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: generate patch for all packages
      shell: bash
      run: sh ./.github/actions/changeset-snapshot/create-pre-release-changeset.sh "$TAG"
      env:
        TAG: ${{ inputs.tag }}

    - name: Generate status
      id: status
      shell: bash
      run: |
        pnpm changeset status --output changeset.json
        RELEASE_COUNT=$(cat changeset.json | jq '.releases | length')
        echo "releases=${RELEASE_COUNT}" >> "$GITHUB_OUTPUT"
      env:
        GITHUB_TOKEN: ${{ inputs.gh-token }}

    # Authentication comes from the calling job's `id-token: write` permission;
    # the caller must be the trusted release.yml workflow in the `npm` environment.
    - name: Version and publish snapshot
      shell: bash
      if: ${{ steps.status.outputs.releases > 0 }}
      run: |
        pnpm changeset version --snapshot "$TAG"
        pnpm publish -r --tag "$TAG" --no-git-checks --report-summary
      env:
        TAG: ${{ inputs.tag }}
        GITHUB_TOKEN: ${{ inputs.gh-token }}

    - uses: actions/upload-artifact@v7
      if: ${{ steps.status.outputs.releases > 0 }}
      with:
        name: changeset-status
        path: changeset.json
