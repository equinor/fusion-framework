name: Dependabot maintenance stream
description: Ensure, initialize, sync, or reset the long-lived branch that accumulates reviewed Dependabot updates

inputs:
  operation:
    description: ensure creates a missing branch; initialize requires it to be missing; sync rebases onto the default branch; reset requires nothing left to promote
    default: ensure
  branch:
    description: Maintenance branch name
    default: maintenance/dependencies
  github-token:
    description: Token with contents write and pull-requests read access
    default: ${{ github.token }}

outputs:
  updated:
    description: Whether sync pushed a rebased maintenance head
    value: ${{ steps.manage.outputs.updated }}
  has-changes:
    description: Whether the rebased stream has changes to promote
    value: ${{ steps.manage.outputs.has-changes }}

runs:
  using: composite
  steps:
    - name: Ensure, initialize, sync, or reset maintenance branch
      id: manage
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MAINTENANCE_BRANCH: ${{ inputs.branch }}
        OPERATION: ${{ inputs.operation }}
        REPOSITORY: ${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/manage-branch.sh"
