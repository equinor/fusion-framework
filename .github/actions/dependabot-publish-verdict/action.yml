name: Dependabot publish verdict
description: Publish or update the AI review comment on a Dependabot pull request and mark the pull request as researched

inputs:
  pr-number:
    description: Dependabot pull request number
    required: true
  signature:
    description: Dependency signature the review applies to
    required: true
  dependency:
    description: Updated dependency name or grouped-dependencies label
    required: true
  version:
    description: New dependency version or `multiple`
    required: true
  head-sha:
    description: Reviewed head commit
    required: true
  review-file:
    description: Path to the review markdown produced by dependabot-review
    required: true
  model:
    description: Model name shown in the comment
    required: true
  run-id:
    description: Workflow run that produced the review
    default: ${{ github.run_id }}
  github-token:
    description: Token with pull-requests write access
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Publish research verdict
      shell: bash
      env:
        DEPENDENCY: ${{ inputs.dependency }}
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPOSITORY: ${{ github.repository }}
        REVIEW_FILE: ${{ inputs.review-file }}
        RUN_ID: ${{ inputs.run-id }}
        SIGNATURE: ${{ inputs.signature }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        marker='<!-- fusion-ai-dependency-research -->'
        dependency_marker="<!-- fusion-ai-dependency:${SIGNATURE} -->"
        comment="$RUNNER_TEMP/dependabot-review-comment.md"
        {
          echo "$marker"
          echo "$dependency_marker"
          echo "# 🤖 Bip Bop - Automated Dependency review of \`${DEPENDENCY}@${VERSION}\`"
          echo
          echo "> [!NOTE]"
          echo "> **Model:** \`${MODEL}\`  "
          echo "> **Reviewed commit:** [\`${HEAD_SHA:0:12}\`](https://github.com/${REPOSITORY}/commit/${HEAD_SHA})  "
          echo "> **Workflow:** [View research run](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})"
          echo
          cat "$REVIEW_FILE"
          echo
          echo "_Generated by Fusion AI using the repository dependency-review skill._"
        } > "$comment"

        comment_id="$(
          gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${marker}\")) | .id" \
            | head -n 1
        )"

        if [[ -n "$comment_id" ]]; then
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/comments/${comment_id}" \
            --raw-field body="$(cat "$comment")"
        else
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file "$comment"
        fi

        gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --add-label '🤖 AI researched'
