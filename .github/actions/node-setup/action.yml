name: Setup Node
description: General setup of node
inputs:
  node-version:
    default: 24
  cache-node-modules:
    description: Restore the OS-specific node_modules cache
    default: 'false'
outputs:
  node-modules-cache-hit:
    description: Whether the exact node_modules cache key was restored
    value: ${{ steps.node-modules-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.22.0

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore node_modules
      if: inputs.cache-node-modules == 'true'
      id: node-modules-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          packages/**/node_modules
          cookbooks/*/node_modules
          vue-press/node_modules
        key: node-modules-fusion-v1-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          node-modules-fusion-v1-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Restore-keys fall back to the closest prior store even when the lockfile
    # hash doesn't match exactly, so PRs reuse main's store instead of
    # installing from scratch. Saving/pruning the cache is done separately by
    # the prime-pnpm-cache workflow on push to main, not on every job here.
    - name: Restore pnpm store
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-fusion-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-fusion-v1-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
