name: Build code base
description: Builds all workspace packages, or only those affected relative to the PR base branch

inputs:
  only-affected:
    description: When true, builds only packages affected since github.base_ref instead of everything
    default: false

runs:
  using: composite
  steps:
    - name: Build project [all]
      if: ${{ inputs.only-affected == 'false' }}
      shell: bash
      run: pnpm build --continue

    # Checkout pins `ref` to the PR head SHA, so it only fetches that commit's
    # history — `main` never becomes a resolvable ref locally, which breaks
    # turbo's `--affected` merge-base lookup unless we fetch it explicitly.
    - name: Fetch main for affected detection
      if: ${{ inputs.only-affected == 'true' }}
      shell: bash
      run: git fetch origin main

    - name: Build project [affected]
      if: ${{ inputs.only-affected == 'true' }}
      shell: bash
      run: pnpm turbo run build --continue --affected