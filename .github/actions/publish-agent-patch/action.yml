name: Publish agent patch
description: Validate an issue-agent patch as data and open a pull request ready for review

inputs:
  issue-number:
    description: Open issue implemented by the patch
    required: true
  base-sha:
    description: Trusted default-branch commit used for generation
    required: true
  task-branch:
    description: Unique branch to create without overwriting
    required: true
  patch:
    description: Path to the generated binary Git patch
    required: true
  pull-request:
    description: Path to the generated pull request title and body
    required: true
  execution-report:
    description: Path to the generated execution report
    required: true
  checksums:
    description: Path to SHA-256 checksums for the patch and generated reports
    required: true

outputs:
  pull_request_url:
    description: URL of the created draft pull request
    value: ${{ steps.publish.outputs.pull_request_url }}

runs:
  using: composite
  steps:
    - name: Validate and publish draft
      id: publish
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        CHECKSUM_PATH: ${{ inputs.checksums }}
        EXECUTION_REPORT_PATH: ${{ inputs.execution-report }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        PATCH_PATH: ${{ inputs.patch }}
        PULL_REQUEST_PATH: ${{ inputs.pull-request }}
        TASK_BRANCH: ${{ inputs.task-branch }}
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
