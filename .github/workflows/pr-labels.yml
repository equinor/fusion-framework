name: pr labels
on:
  pull_request_target:
    types:
      - ready_for_review
      - opened
      - synchronize

permissions: read-all

jobs:
  labeler:
    name: Auto-Label PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: fuxingloh/multi-labeler@bcd50af464202999e57f556b4aefcf05a34abf85 # v5.0.0
