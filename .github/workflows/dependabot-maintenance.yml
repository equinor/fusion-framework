name: Dependabot maintenance stream

on:
  push:
    branches:
      - main
      - maintenance/dependencies
  delete:
  workflow_dispatch:
    inputs:
      operation:
        description: Ensure, initialize, sync, promote, or reset the dependency maintenance stream
        required: true
        type: choice
        options:
          - ensure
          - initialize
          - sync
          - promote
          - reset

concurrency:
  group: dependabot-maintenance-stream
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAINTENANCE_BRANCH: maintenance/dependencies

jobs:
  manage-branch:
    name: Ensure, sync, or reset maintenance branch
    if: >-
      (
        github.event_name != 'delete' ||
        (github.event.ref_type == 'branch' && github.event.ref == 'maintenance/dependencies')
      ) &&
      !(
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        vars.GREENKEEPER_MAINTENANCE_ENABLED == 'true'
      )
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.branch.outputs.updated }}
      has-changes: ${{ steps.branch.outputs.has-changes }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}

      - name: Ensure, initialize, sync, or reset maintenance branch
        id: branch
        uses: ./.github/actions/dependabot-maintenance-stream
        with:
          branch: ${{ env.MAINTENANCE_BRANCH }}
          operation: ${{ inputs.operation == 'initialize' && 'initialize' || inputs.operation == 'reset' && 'reset' || (inputs.operation == 'sync' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'sync' || 'ensure' }}
          github-token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}

  validate:
    name: Validate maintenance stream
    needs: manage-branch
    if: >-
      inputs.operation == 'promote' ||
      (needs.manage-branch.outputs.updated == 'true' && needs.manage-branch.outputs.has-changes == 'true')
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    runs-on: ubuntu-latest
    # Installs and runs dependency code, so it holds no write permissions.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.MAINTENANCE_BRANCH }}
          fetch-depth: 0

      - name: Record validated commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup

      - name: Install Playwright Chromium
        run: pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright install --with-deps chromium

      - name: Validate maintenance stream
        run: pnpm build && pnpm test && pnpm -w check

  promote:
    name: Maintain promotion pull request
    needs: [manage-branch, validate]
    if: >-
      always() &&
      needs.manage-branch.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (
        inputs.operation == 'promote' ||
        (needs.manage-branch.outputs.updated == 'true' && needs.manage-branch.outputs.has-changes == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/maintenance/dependencies')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Only trusted default-branch code runs here; the maintenance branch is read through git, never executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create or update draft promotion pull request
        id: promotion
        uses: ./.github/actions/dependabot-promotion-pr
        with:
          branch: ${{ env.MAINTENANCE_BRANCH }}
          github-token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}
          validated: ${{ needs.validate.result == 'success' }}

      - name: Mark ready and enable squash auto-merge for the validated head
        if: needs.validate.result == 'success'
        uses: ./.github/actions/dependabot-enable-auto-merge
        with:
          expected-head-sha: ${{ needs.validate.outputs.head_sha }}
          github-token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}
          mark-ready: true
          pr-number: ${{ steps.promotion.outputs.pr-number }}
          skip-on-head-mismatch: true
