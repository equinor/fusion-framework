name: Update APM dependencies

on:
  schedule:
    - cron: '17 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: apm-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Fusion developer profile
    uses: equinor/fusion-skills/.github/workflows/apm-sync.yml@v1.9.0
    with:
      apm-version: '0.33.0'
      pr-branch: automation/apm-update
