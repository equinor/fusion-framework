name: 🔒 Verify Actions Lockfile

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: actions-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned so a new extension release cannot change what this check accepts.
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.0

      # `--ignore-local-actions` allows the deliberate `./build-docs` in generate-docs.yml, whose
      # actions are locked through its `$/` steps. The full-directory run also catches stale entries.
      - name: Verify lockfile matches workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --ignore-local-actions

      # Strict pass: an accidental `./` reference to an action that uses other actions fails here.
      # Run-only `./` helpers still pass, since they have nothing to lock.
      - name: Verify local actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -name '*.yml' ! -name generate-docs.yml | sort)
          gh actions-lock --verify "${workflows[@]}"
