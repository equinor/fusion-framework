name: PR

on:
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - '.changeset/**'
      - 'vue-press/**'
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit SHA to validate
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: number
      greenkeeper_smoke:
        description: Run the manual export-only Greenkeeper smoke test on this workflow's exact branch commit
        type: boolean
        default: false
      greenkeeper_orchestrator_image:
        description: Reviewed immutable trusted orchestrator image for the smoke test
        type: string
        default: ''
      greenkeeper_image:
        description: Matching immutable sandbox image for the smoke test
        type: string
        default: ''
      greenkeeper_gateway_image:
        description: Matching immutable credential-gateway image for the smoke test
        type: string
        default: ''

concurrency:
  group: pr-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number }}
  # Bot pushes (e.g. the release PR) start as `action_required` runs; approving them re-runs the same
  # commit around the time the PR is marked ready. Only fresh runs cancel, so those same-commit runs
  # queue instead of cancelling each other and leaving a failed required check on the PR.
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' && github.run_attempt == '1' }}

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

env:
  REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
  REVIEWDOG_REPORTER: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft) && 'github-pr-check' || 'github-pr-review' }}
  TURBO_CACHE: local:rw

jobs:
  code-quality:
    name: Code quality
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # runs-on: fusion-gh-runner-fusion-framework.borked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup
        with:
          wait-for-turbo-cache: 'true'

      - uses: reviewdog/action-setup@v1

      - name: Lint source files
        uses: mongolyy/reviewdog-action-biome@v2
        with:
          github_token: ${{ github.token }}
          reporter: ${{ env.REVIEWDOG_REPORTER }}
          level: error

      - name: Build fusion-lint
        run: pnpm build:lint

      - name: Fusion lint
        run: |
          pnpm exec fusion-lint changed --reporter=rdjsonl \
            | reviewdog \
                -name="fusion-lint" \
                -f=rdjsonl \
                -reporter=${{ env.REVIEWDOG_REPORTER }} \
                -fail-level=error

      - name: Verify package exports
        run: pnpm verify:package-exports

      - name: Verify native Node ESM (package type and import extensions)
        run: pnpm verify:esm

  build:
    name: Build affected packages
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # runs-on: fusion-gh-runner-fusion-framework.borked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup
        with:
          wait-for-turbo-cache: 'true'

      - uses: reviewdog/action-setup@v1

      - name: Build affected packages
        id: build
        continue-on-error: true
        uses: ./.github/actions/build-packages
        with:
          only-affected: true

      - name: Process build log
        run: node process-turbo-build-log.cjs > tsc-build.log

      - name: Upload build log
        uses: actions/upload-artifact@v7
        with:
          path: tsc-build.log

      - name: Review build log
        run: reviewdog -name=tsc -f=tsc -reporter=${{ env.REVIEWDOG_REPORTER }} -fail-level=error < tsc-build.log

      - name: Check if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify built packages load under native Node ESM
        run: pnpm verify:esm:runtime

  unit-tests:
    name: Unit tests
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # runs-on: fusion-gh-runner-fusion-framework.borked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup
        with:
          wait-for-turbo-cache: 'true'

      - name: Build test dependencies
        run: |
          pnpm turbo build \
            --filter @equinor/fusion-framework-vitest-plugin-react-app... \
            --filter @equinor/fusion-framework-react-app...

      - name: Get Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm test

      - name: Test maintenance branch lifecycle
        run: node --test .github/scripts/dependabot-maintenance.test.mjs .github/scripts/greenkeeper-maintenance.test.mjs

      - name: Test npm trusted publishing tooling
        run: node --test .github/scripts/npm-trusted-publishing.test.mjs

      - name: Test Turbo cache readiness
        run: node --test .github/scripts/wait-for-turbo-cache.test.mjs

  greenkeeper-smoke:
    name: Greenkeeper export-only smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.greenkeeper_smoke
    runs-on: ubuntu-latest
    environment: docs
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
      packages: read
      id-token: write
    steps:
      - name: Validate exact preview context and reviewed pins
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.head_sha }}
          ORCHESTRATOR_IMAGE: ${{ inputs.greenkeeper_orchestrator_image }}
          SANDBOX_IMAGE: ${{ inputs.greenkeeper_image }}
          GATEWAY_IMAGE: ${{ inputs.greenkeeper_gateway_image }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_SHA" == "$GITHUB_SHA" ]] ||
            { echo "::error::Dispatch on the reviewed candidate branch with head_sha equal to its exact event SHA."; exit 1; }
          [[ "$ORCHESTRATOR_IMAGE" =~ ^ghcr\.io/equinor/fusion-poc-greenkeeper@sha256:[a-f0-9]{64}$ &&
             "$SANDBOX_IMAGE" =~ ^ghcr\.io/equinor/fusion-poc-greenkeeper@sha256:[a-f0-9]{64}$ &&
             "$GATEWAY_IMAGE" =~ ^ghcr\.io/equinor/fusion-poc-greenkeeper@sha256:[a-f0-9]{64}$ ]] ||
            { echo "::error::Supply reviewed immutable orchestrator, sandbox and gateway image digests."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Authenticate GHCR using the Framework job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify all pinned images can be pulled
        shell: bash
        env:
          SANDBOX_IMAGE: ${{ inputs.greenkeeper_image }}
          GATEWAY_IMAGE: ${{ inputs.greenkeeper_gateway_image }}
          ORCHESTRATOR_IMAGE: ${{ inputs.greenkeeper_orchestrator_image }}
        run: |
          set -euo pipefail
          failed=0
          for image in "$ORCHESTRATOR_IMAGE" "$SANDBOX_IMAGE" "$GATEWAY_IMAGE"; do
            if docker pull "$image"; then
              echo "GHCR pull verified: $image"
            else
              echo "::error::Framework job token cannot pull $image"
              failed=1
            fi
          done
          exit "$failed"

      - name: Test maintenance without a publishing credential
        uses: ./.github/actions/greenkeeper-maintenance
        with:
          task: dependency
          export-only: 'true'
          preview-policy-revision: ${{ inputs.head_sha }}
          client-id: ${{ vars.FUSION_AI_SP_CLIENT_ID }}
          orchestrator-image: ${{ inputs.greenkeeper_orchestrator_image }}
          image: ${{ inputs.greenkeeper_image }}
          gateway-image: ${{ inputs.greenkeeper_gateway_image }}
          github-token: ${{ github.token }}
          apm-token: ${{ secrets.APM_FUSION_SKILLS_TOKEN }}

  required-check:
    name: Check Code
    if: always() && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    needs:
      - code-quality
      - build
      - unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify all PR checks passed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$JOB_RESULTS")
          if [[ -n "$failures" ]]; then
            echo "Required PR checks did not pass:"
            echo "$failures"
            exit 1
          fi
