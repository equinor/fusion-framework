name: PR

on:
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
      - closed
    paths-ignore:
      - '.changeset/**'
      - 'vue-press/**'
  pull_request_target:
    types:
      - ready_for_review
      - opened
      - synchronize
  pull_request_review:
    types:
      - submitted

concurrency:
  group: pr-${{ github.event_name }}-${{ github.event.pull_request.id }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  CHECKOUT_FETCH_DEPTH: ${{ (github.actor != 'dependabot[bot]' && '0') || '1' }}
  REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
  REVIEWDOG_REPORTER: ${{ (github.event.pull_request.draft && 'github-pr-check') || 'github-pr-review' }}

jobs:
  code-quality:
    name: Code quality
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: fusion-gh-runner-fusion-framework
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}

      - name: Setup fusion runner
        continue-on-error: true
        uses: ./.github/actions/setup-fusion-runner

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup

      - uses: reviewdog/action-setup@v1

      - name: Lint source files
        uses: mongolyy/reviewdog-action-biome@v2
        with:
          github_token: ${{ github.token }}
          reporter: ${{ env.REVIEWDOG_REPORTER }}
          level: error

      - name: Build fusion-lint
        run: pnpm build:lint

      - name: Fusion lint
        run: |
          pnpm exec fusion-lint changed --reporter=rdjsonl \
            | reviewdog \
                -name="fusion-lint" \
                -f=rdjsonl \
                -reporter=${{ env.REVIEWDOG_REPORTER }} \
                -fail-level=error

      - name: Verify package exports
        run: pnpm verify:package-exports

      - name: Verify agent context
        run: pnpm verify:agent-context

  build:
    name: Build affected packages
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: fusion-gh-runner-fusion-framework
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}

      - name: Setup fusion runner
        continue-on-error: true
        uses: ./.github/actions/setup-fusion-runner

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup

      - uses: reviewdog/action-setup@v1

      - name: Build affected packages
        id: build
        continue-on-error: true
        uses: ./.github/actions/build-packages
        with:
          only-affected: true

      - name: Process build log
        run: node process-turbo-build-log.cjs > tsc-build.log

      - name: Upload build log
        uses: actions/upload-artifact@v7
        with:
          path: tsc-build.log

      - name: Review build log
        run: reviewdog -name=tsc -f=tsc -reporter=${{ env.REVIEWDOG_REPORTER }} -fail-level=error < tsc-build.log

      - name: Check if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  unit-tests:
    name: Unit tests
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: fusion-gh-runner-fusion-framework
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup fusion runner
        continue-on-error: true
        uses: ./.github/actions/setup-fusion-runner

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup

      - name: Get Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm test

  cookbook-tests:
    name: Cookbook Playwright tests
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: fusion-gh-runner-fusion-framework
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}

      - name: Setup fusion runner
        continue-on-error: true
        uses: ./.github/actions/setup-fusion-runner

      - name: Setup node and install deps
        uses: ./.github/actions/node-setup

      - name: Fetch main for affected detection
        run: git fetch origin main:main

      - name: Check for affected cookbook tests
        id: affected
        run: |
          taskCount=$(pnpm turbo run test:playwright --affected \
            --filter @equinor/fusion-framework-cookbook-app-react-context \
            --filter @equinor/fusion-framework-cookbook-app-react-mock-playwright \
            --dry=json \
            | jq '[.tasks[] | select(.task == "test:playwright" and .command != "<NONEXISTENT>")] | length')
          echo "task-count=$taskCount" >> "$GITHUB_OUTPUT"

      - name: Get Playwright version
        if: steps.affected.outputs.task-count != '0'
        id: playwright
        run: |
          version=$(pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        if: steps.affected.outputs.task-count != '0'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.affected.outputs.task-count != '0'
        run: pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright install --with-deps chromium

      - name: Run cookbook Playwright tests
        if: steps.affected.outputs.task-count != '0'
        run: |
          pnpm turbo run test:playwright --affected \
            --filter @equinor/fusion-framework-cookbook-app-react-context \
            --filter @equinor/fusion-framework-cookbook-app-react-mock-playwright

  required-check:
    name: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && 'Check Code' || 'PR event complete' }}
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    needs:
      - code-quality
      - build
      - unit-tests
      - cookbook-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify all PR checks passed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$JOB_RESULTS")
          if [[ -n "$failures" ]]; then
            echo "Required PR checks did not pass:"
            echo "$failures"
            exit 1
          fi

  dependabot:
    name: Dependabot
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dependabot.yml

  labels:
    name: PR labels
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-labels.yml

  review:
    name: PR review
    if: github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-review-dismissed.yml

  cleanup:
    name: PR cache cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/cleanup-caches.yml
