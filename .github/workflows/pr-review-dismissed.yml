name: pr review dismissed
on:
  pull_request_review:
    types:
      - submitted

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set pull request to draft
        if: ${{ github.event.review.state == 'changes_requested' }}
        # GitHub App tokens can reject the draft-conversion mutation even with pull-request write access.
        continue-on-error: true
        run: gh pr ready ${{ github.event.pull_request.number }} --undo
        env:
          GH_TOKEN: ${{ github.token }}
