name: Greenkeeper dependency maintenance

on:
  push:
    branches: [main]
  # Weekday schedule disabled during evaluation; re-enable with:
  # schedule:
  #   - cron: '17 5 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: Add each update's checks, diagnostics and limitations to the run summary (credentials redacted)
        type: boolean
        default: false

permissions:
  contents: read

# During evaluation Framework follows Greenkeeper's main channel: each run resolves these tags to digests, runs
# only those digests and records them in the run summary. Pin @sha256 digests here to freeze a reviewed version.
env:
  GREENKEEPER_ORCHESTRATOR_IMAGE: ghcr.io/equinor/fusion-poc-greenkeeper:orchestrator-main
  GREENKEEPER_SANDBOX_IMAGE: ghcr.io/equinor/fusion-poc-greenkeeper:sandbox-node-main
  GREENKEEPER_GATEWAY_IMAGE: ghcr.io/equinor/fusion-poc-greenkeeper:gateway-main

concurrency:
  group: greenkeeper-maintenance
  cancel-in-progress: false

jobs:
  disabled:
    if: github.event_name != 'workflow_dispatch' && vars.GREENKEEPER_MAINTENANCE_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report inactive dependency maintenance
        run: |
          echo 'Greenkeeper dependency maintenance is not enabled; set GREENKEEPER_MAINTENANCE_ENABLED=true to run it automatically.' >> "$GITHUB_STEP_SUMMARY"

  maintain:
    if: >-
      (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (vars.GREENKEEPER_MAINTENANCE_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: docs
    # Each update is pushed when accepted, so a run that times out loses only the update in progress.
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Combine Dependabot updates on greenkeeper/dependencies
        uses: ./.github/actions/greenkeeper-maintenance
        with:
          client-id: ${{ vars.FUSION_AI_SP_CLIENT_ID }}
          orchestrator-image: ${{ env.GREENKEEPER_ORCHESTRATOR_IMAGE }}
          image: ${{ env.GREENKEEPER_SANDBOX_IMAGE }}
          gateway-image: ${{ env.GREENKEEPER_GATEWAY_IMAGE }}
          github-token: ${{ github.token }}
          apm-token: ${{ secrets.APM_FUSION_SKILLS_TOKEN }}
          publish-token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN }}
          # "Re-run with debug logging" also enables it.
          debug: ${{ inputs.debug == true || runner.debug == '1' }}
