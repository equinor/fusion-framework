name: Greenkeeper maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      export-only:
        description: Inspect and export without creating or rewriting branches
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: greenkeeper-maintenance
  cancel-in-progress: false

jobs:
  disabled:
    if: github.event_name == 'push' && vars.GREENKEEPER_MAINTENANCE_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report unchanged maintenance ownership
        run: |
          echo 'Greenkeeper maintenance is disabled; the existing Dependabot workflow still owns main-push sync.' >> "$GITHUB_STEP_SUMMARY"

  maintain:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (vars.GREENKEEPER_MAINTENANCE_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: docs
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Maintain dependency stream in Framework
        uses: ./.github/actions/greenkeeper-maintenance
        with:
          task: dependency
          export-only: ${{ github.event_name == 'workflow_dispatch' && inputs.export-only && 'true' || 'false' }}
          client-id: ${{ vars.FUSION_AI_SP_CLIENT_ID }}
          orchestrator-image: ${{ vars.GREENKEEPER_ORCHESTRATOR_IMAGE }}
          image: ${{ vars.GREENKEEPER_IMAGE }}
          gateway-image: ${{ vars.GREENKEEPER_GATEWAY_IMAGE }}
          github-token: ${{ github.token }}
          apm-token: ${{ secrets.APM_FUSION_SKILLS_TOKEN }}
          publish-token: ${{ (github.event_name == 'push' || !inputs.export-only) && secrets.DEPENDABOT_AUTOMATION_TOKEN || '' }}
