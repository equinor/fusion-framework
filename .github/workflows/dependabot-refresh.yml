name: Refresh Dependabot branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: refresh-dependabot-branches
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch branch maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --limit 100 \
            --json author,labels,number \
            --jq '
              .[] |
              select(.author.login == "app/dependabot") |
              select(any(.labels[]; .name == "🤖 AI researched")) |
              .number
            ' |
            while read -r pr_number; do
              gh workflow run dependabot-ai-review.yml \
                --repo "$REPOSITORY" \
                --ref main \
                -f pr_number="$pr_number"
            done
