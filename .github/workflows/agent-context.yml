name: Agent context

# The AI context files (CODEMAP.md, instruction frontmatter) are hand-maintained.
# When they drift, agents skip searching and act on stale paths — so verify them
# on every change to the workspace shape or to the files themselves.

on:
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
    paths:
      - CODEMAP.md
      - AGENTS.md
      - package.json
      - .github/copilot-instructions.md
      - .github/instructions/**
      - .github/scripts/verify-agent-context.mjs
      - .github/workflows/agent-context.yml
      - .github/workflows/apm-update.yml
      - .github/agents/**
      - .agents/skills/**
      - .vscode/mcp.json
      - apm.yml
      - apm.lock.yaml
      - packages/**/package.json
      - cookbooks/*/package.json
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit SHA to validate
        required: false
        type: string
      pr_number:
        description: Pull request number
        required: false
        type: number

permissions:
  contents: read

jobs:
  verify:
    name: Verify agent context is in sync
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Reads manifests directly — no dependency install needed.
      - name: Verify agent context
        run: node .github/scripts/verify-agent-context.mjs

      - name: Set up APM
        uses: microsoft/apm-action@v1
        with:
          apm-version: '0.33.0'
          setup-only: 'true'

      # equinor/fusion-skills is an internal repository, so the job token cannot clone it.
      # APM reads the per-organization token from GITHUB_APM_PAT_EQUINOR.
      - name: Audit committed agent configuration
        env:
          GITHUB_APM_PAT_EQUINOR: ${{ secrets.APM_FUSION_SKILLS_TOKEN || github.token }}
        run: apm audit --ci --no-policy

      - name: Verify locked installation
        env:
          GITHUB_APM_PAT_EQUINOR: ${{ secrets.APM_FUSION_SKILLS_TOKEN || github.token }}
        run: |
          apm install --frozen --target copilot
          git diff --exit-code
          git ls-files --others --exclude-standard -- .agents .github .vscode apm.yml apm.lock.yaml > "$RUNNER_TEMP/apm-untracked.txt"
          if [ -s "$RUNNER_TEMP/apm-untracked.txt" ]; then
            echo "::error::Locked installation generated uncommitted agent files"
            cat "$RUNNER_TEMP/apm-untracked.txt"
            exit 1
          fi

      - name: Audit locked installation
        env:
          GITHUB_APM_PAT_EQUINOR: ${{ secrets.APM_FUSION_SKILLS_TOKEN || github.token }}
        run: apm audit --ci --no-policy
