name: Dependabot AI review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependabot pull request number
        required: true
        type: number

concurrency:
  group: dependabot-ai-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  research:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, '🤖 AI researched')
      )
    environment: docs
    runs-on: fusion-gh-runner-fusion-framework
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Fusion runner
        continue-on-error: true
        uses: ./.github/actions/setup-fusion-runner

      - name: Install Copilot CLI
        run: |
          set -euo pipefail

          curl --fail-with-body --location --silent --show-error \
            --output "$RUNNER_TEMP/copilot.tar.gz" \
            https://github.com/github/copilot-cli/releases/download/v1.0.80/copilot-linux-x64.tar.gz
          echo '039933c9247686131c4406abb1d439bdbf68103edc1ff585bd70d5b0dc940f72  '"$RUNNER_TEMP"'/copilot.tar.gz' \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/copilot.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify Dependabot pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr="$(gh pr view "$PR_NUMBER" --json author,title)"
          test "$(jq --raw-output '.author.login' <<< "$pr")" = app/dependabot
          title="$(jq --raw-output '.title' <<< "$pr")"
          if [[ ! "$title" =~ [Bb]ump[[:space:]](.+)[[:space:]]from[[:space:]][^[:space:]]+[[:space:]]to[[:space:]]([^[:space:]]+)$ ]]; then
            echo "::error::Could not extract dependency and target version from: $title"
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "dependency=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Ensure Azure CLI is installed
        run: |
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

      - name: Azure login
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ vars.FUSION_AI_SP_CLIENT_ID }}
          tenant-id: 3aa4a235-b6e2-48d5-9195-7fcf05b459b0
          allow-no-subscriptions: true

      - name: Configure Fusion AI provider
        env:
          FUSION_ENV: fprd
        run: |
          set -euo pipefail

          discovery_token="$(
            az account get-access-token \
              --scope '5a842df8-3238-415d-b168-9f16a6a6031b/.default' \
              --query accessToken \
              --output tsv
          )"
          service="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${discovery_token}" \
              "https://discovery.fusion.equinor.com/service-registry/environments/${FUSION_ENV}/services" \
              | jq --exit-status 'map(select(.key == "ai")) | first'
          )"
          endpoint="$(jq --exit-status --raw-output '.uri' <<< "$service")"
          scope="$(jq --exit-status --raw-output '.scopes[0]' <<< "$service")"
          token="$(
            az account get-access-token \
              --scope "$scope" \
              --query accessToken \
              --output tsv
          )"

          echo "::add-mask::$token"
          echo "COPILOT_PROVIDER_BASE_URL=${endpoint%/}" >> "$GITHUB_ENV"
          echo "COPILOT_PROVIDER_BEARER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Review dependency update
        env:
          COPILOT_PROVIDER_MODEL_ID: gpt-5.4
          COPILOT_PROVIDER_WIRE_MODEL: gpt-5.6-luna
          COPILOT_PROVIDER_AZURE_API_VERSION: 2025-01-01-preview
          COPILOT_PROVIDER_TYPE: azure
          COPILOT_PROVIDER_WIRE_API: completions
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          set -euo pipefail

          copilot --version
          echo '::group::🤖 Fusion AI reasoning and tool activity'
          set +e
          copilot \
            --agent dependabot \
            --prompt "Review pull request #${PR_NUMBER} in audit-only mode. Use the fusion-dependency-review skill. Research its dependency changes and repository impact. Return concise GitHub-flavored Markdown without an H1 heading. Start with exactly one verdict heading: '## 🟢 Verdict: MERGE', '## 🟡 Verdict: HOLD', or '## 🔴 Verdict: DECLINE'. Then include a short rationale, a '### Key findings' bullet list, and a '### Required actions' task list. Use links for evidence. Do not modify files, post comments, approve, close, or merge." \
            --enable-reasoning-summaries \
            --output-format json \
            --stream off \
            --allow-all-tools \
            --allow-all-urls \
            --no-ask-user \
            --no-auto-update \
            --secret-env-vars=COPILOT_PROVIDER_BEARER_TOKEN \
            | tee "$RUNNER_TEMP/dependabot-review.jsonl" \
            | jq --unbuffered --raw-output '
                select(type == "object") |
                if .type == "assistant.message" and
                  (.data.content | length) > 0 and
                  (.data.toolRequests | length) > 0
                then "💭 " + .data.content
                elif .type == "tool.execution_start"
                then "🔧 " + .data.toolName + (
                  .data.arguments.description //
                  .data.arguments.skill //
                  .data.arguments.path //
                  .data.arguments.url //
                  .data.arguments.pattern //
                  .data.arguments.query //
                  .data.arguments.element //
                  "" |
                  if length > 0 then " — " + . else "" end
                )
                else empty
                end
              '
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          echo '::endgroup::'

          for status in "${pipeline_status[@]}"; do
            if [[ "$status" -ne 0 ]]; then
              exit "$status"
            fi
          done

          jq --slurp --raw-output '
            [
              .[] |
              select(
                type == "object" and
                .type == "assistant.message" and
                (.data.toolRequests | length) == 0 and
                (.data.content | length) > 0
              ) |
              .data.content
            ] |
            last
          ' "$RUNNER_TEMP/dependabot-review.jsonl" > "$RUNNER_TEMP/dependabot-review.md"

          grep -Eq '^## (🟢 Verdict: MERGE|🟡 Verdict: HOLD|🔴 Verdict: DECLINE)$' \
            "$RUNNER_TEMP/dependabot-review.md"
          grep -Fq '### Key findings' "$RUNNER_TEMP/dependabot-review.md"
          grep -Fq '### Required actions' "$RUNNER_TEMP/dependabot-review.md"

          cat "$RUNNER_TEMP/dependabot-review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish research verdict
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY: ${{ steps.pull-request.outputs.dependency }}
          MODEL: gpt-5.6-luna
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ steps.pull-request.outputs.version }}
        run: |
          set -euo pipefail

          marker='<!-- fusion-ai-dependency-research -->'
          comment="$RUNNER_TEMP/dependabot-review-comment.md"
          {
            echo "$marker"
            echo "# 🤖 Bip Bop - Automated Dependency review of \`${DEPENDENCY}@${VERSION}\`"
            echo
            echo "> [!NOTE]"
            echo "> **Model:** \`${MODEL}\`  "
            echo "> **Workflow:** [View research run](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})"
            echo
            cat "$RUNNER_TEMP/dependabot-review.md"
            echo
            echo "_Generated by Fusion AI using the repository dependency-review skill._"
          } > "$comment"

          comment_id="$(
            gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${marker}\")) | .id" \
              | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              --raw-field body="$(cat "$comment")"
          else
            gh pr comment "$PR_NUMBER" --body-file "$comment"
          fi

      - name: Mark research complete
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: gh pr edit "$PR_NUMBER" --add-label '🤖 AI researched'
