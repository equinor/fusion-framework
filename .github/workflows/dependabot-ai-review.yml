name: Dependabot AI review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependabot pull request number
        required: true
        type: number
      confirmed_head_sha:
        description: Dependabot head commit authorized for maintenance or resolution
        required: false
        type: string
      authorized_actor:
        description: Maintainer who explicitly authorized dependency resolution
        required: false
        type: string
      operation:
        description: Read-only research, branch maintenance, or maintainer-authorized resolution
        required: true
        default: research
        type: choice
        options:
          - research
          - maintain
          - resolve

concurrency:
  group: >-
    dependabot-ai-review-${{ inputs.pr_number || github.event.pull_request.number }}-${{
      (inputs.operation == 'maintain' || inputs.operation == 'resolve') &&
      'mutation' || 'research'
    }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    # Reviews share one model quota across PRs; retain pending jobs instead of replacing them.
    concurrency:
      group: dependabot-ai-review-inference
      cancel-in-progress: false
      queue: max
    outputs:
      auto_merge: ${{ (steps.review.outputs.auto-merge == 'true' || steps.verdict.outputs.auto-merge == 'true') && 'true' || 'false' }}
      base_ref: ${{ steps.pull-request.outputs.base-ref }}
      dependency: ${{ steps.pull-request.outputs.dependency }}
      from_version: ${{ steps.pull-request.outputs.from-version }}
      head_sha: ${{ steps.pull-request.outputs.head-sha }}
      head_ref: ${{ steps.pull-request.outputs.head-ref }}
      high_confidence: ${{ (steps.review.outputs.high-confidence == 'true' || steps.verdict.outputs.high-confidence == 'true') && 'true' || 'false' }}
      merge_recommended: ${{ (steps.review.outputs.merge-recommended == 'true' || steps.verdict.outputs.merge-recommended == 'true') && 'true' || 'false' }}
      pr_number: ${{ steps.pull-request.outputs.number }}
      signature: ${{ steps.pull-request.outputs.signature }}
      update_summary: ${{ steps.pull-request.outputs.update-summary }}
      review_needed: ${{ steps.verdict.outputs.found == 'true' && 'false' || 'true' }}
      version: ${{ steps.pull-request.outputs.version }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.action != 'closed' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        (
          github.event.action == 'synchronize' ||
          !contains(github.event.pull_request.labels.*.name, '🤖 AI researched')
        )
      )
    environment: docs
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    # runs-on: fusion-gh-runner-fusion-framework.borked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify Dependabot pull request
        id: pull-request
        uses: ./.github/actions/dependabot-pr-context
        with:
          authorized-actor: ${{ inputs.authorized_actor }}
          confirmed-head-sha: ${{ inputs.confirmed_head_sha }}
          operation: ${{ inputs.operation || 'research' }}
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number }}

      - name: Check for a current verdict
        id: verdict
        uses: ./.github/actions/dependabot-read-verdict
        with:
          pr-number: ${{ steps.pull-request.outputs.number }}
          signature: ${{ steps.pull-request.outputs.signature }}

      - name: Setup Copilot with Fusion AI
        id: copilot
        if: steps.verdict.outputs.found != 'true'
        uses: ./.github/actions/setup-copilot-fusion-ai
        with:
          client-id: ${{ vars.FUSION_AI_SP_CLIENT_ID }}
          wire-model: gpt-6-luna

      - name: Review dependency update
        id: review
        if: steps.verdict.outputs.found != 'true'
        uses: ./.github/actions/dependabot-review
        with:
          pr-number: ${{ steps.pull-request.outputs.number }}
          provider-env: ${{ steps.copilot.outputs.provider-env }}

      - name: Save research verdict
        if: steps.verdict.outputs.found != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-research-${{ steps.pull-request.outputs.number }}
          path: ${{ steps.review.outputs.markdown-file }}
          retention-days: 1

  publish:
    name: Publish research
    needs: research
    if: needs.research.outputs.review_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dependency-research-${{ needs.research.outputs.pr_number }}
          path: ${{ runner.temp }}

      - name: Publish research verdict
        uses: ./.github/actions/dependabot-publish-verdict
        with:
          dependency: ${{ needs.research.outputs.dependency }}
          head-sha: ${{ needs.research.outputs.head_sha }}
          model: gpt-6-luna
          pr-number: ${{ needs.research.outputs.pr_number }}
          review-file: ${{ runner.temp }}/dependabot-review.md
          signature: ${{ needs.research.outputs.signature }}
          version: ${{ needs.research.outputs.version }}

  queue-maintenance:
    name: Queue high-confidence maintenance
    needs: [research, publish]
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      needs.research.outputs.base_ref == 'maintenance/dependencies' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch reviewed branch maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.research.outputs.head_sha }}
          PR_NUMBER: ${{ needs.research.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh workflow run dependabot-ai-review.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f confirmed_head_sha="$HEAD_SHA" \
            -f operation=maintain

  promote-maintenance:
    name: Queue maintenance promotion
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'maintenance/dependencies'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # The promotion run validates the whole maintenance branch and updates the draft PR to main.
      # Concurrent dispatches queue behind the running promotion, so a burst of merges validates once more at most.
      - name: Dispatch maintenance promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh workflow run dependabot-maintenance.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f operation=promote

  remediate:
    name: Maintain branch and add changesets
    needs: [research, publish]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'maintain' || inputs.operation == 'resolve') &&
      needs.research.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    outputs:
      head_sha: ${{ steps.maintain.outputs.head-sha }}
      ready: ${{ steps.maintain.outputs.ready }}
      updated: ${{ steps.maintain.outputs.updated }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
    steps:
      # Action code always comes from the default branch; the Dependabot branch is checked out beside it as data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: pr-branch
          ref: ${{ needs.research.outputs.head_sha }}
          token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}

      - name: Maintain branch and add required changesets
        id: maintain
        uses: ./.github/actions/dependabot-maintain-branch
        with:
          base-ref: ${{ needs.research.outputs.base_ref }}
          expected-head-sha: ${{ needs.research.outputs.head_sha }}
          github-token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}
          head-ref: ${{ needs.research.outputs.head_ref }}
          operation: ${{ inputs.operation }}
          pr-number: ${{ needs.research.outputs.pr_number }}
          signature: ${{ needs.research.outputs.signature }}
          update-summary: ${{ needs.research.outputs.update_summary }}
          working-directory: pr-branch

  auto-merge:
    name: Enable squash auto-merge
    needs: [research, publish, remediate]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'maintain' || inputs.operation == 'resolve') &&
      needs.research.outputs.base_ref == 'maintenance/dependencies' &&
      needs.remediate.outputs.ready == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Enable auto-merge for reviewed head
        uses: ./.github/actions/dependabot-enable-auto-merge
        with:
          expected-author: app/dependabot
          expected-head-sha: ${{ needs.remediate.outputs.head_sha }}
          github-token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}
          pr-number: ${{ needs.research.outputs.pr_number }}
