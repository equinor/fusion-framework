name: Prime CI caches

# Saving the pnpm store cache used to happen inside every job that called
# node-setup, so any push to main that triggered more than one workflow
# raced to save the same cache key. Do it once, here, decoupled from CI.
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the latest push's lockfile matters for the cache, so a superseded
  # run for an older commit is wasted work — cancel it instead of queuing.
  cancel-in-progress: true

permissions:
  actions: write # Required to delete stale pnpm-store caches
  contents: read

jobs:
  prime-playwright-cache:
    name: Save Playwright cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7

      - name: Setup node and install deps
        id: node-setup
        uses: ./.github/actions/node-setup
        with:
          cache-node-modules: 'true'

      - name: Save node_modules
        if: steps.node-setup.outputs.node-modules-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            packages/**/node_modules
            cookbooks/*/node_modules
            vue-press/node_modules
          key: node-modules-fusion-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Get Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright install chromium

      - name: Save Playwright browsers
        if: steps.playwright-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Delete stale hosted-runner caches
        if: steps.playwright-restore.outputs.cache-hit != 'true' || steps.node-setup.outputs.node-modules-cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          playwrightKey="playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}"
          nodeModulesKey="node-modules-fusion-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}"
          for prefix in \
            "playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-" \
            "node-modules-fusion-v1-${{ runner.os }}-${{ runner.arch }}-node24-"; do
            cacheIds=$(gh cache list --repo "${{ github.repository }}" --ref refs/heads/main \
              --key "$prefix" --limit 100 --json id,key,createdAt \
              --jq "sort_by(.createdAt) | reverse | .[1:] | .[] | select(.key != \"$playwrightKey\" and .key != \"$nodeModulesKey\") | .id")
            for id in $cacheIds; do
              echo "Deleting stale cache $id"
              gh cache delete "$id" --repo "${{ github.repository }}" || true
            done
          done

  prime-cache:
    name: Save pnpm store cache
    runs-on: fusion-gh-runner-fusion-framework
    steps:
      - uses: actions/checkout@v7

      - name: Setup fusion runner
        continue-on-error: true
        uses: ./.github/actions/setup-fusion-runner

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable pnpm
          corepack install --global pnpm@11.22.0

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing exact-match cache
        id: pnpm-store-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-fusion-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Get Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Check for an existing Playwright browser cache
        id: playwright-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
          lookup-only: true

      - name: Install Playwright Chromium
        if: steps.playwright-restore.outputs.cache-hit != 'true'
        run: pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright install chromium

      - name: Save Playwright browser cache
        if: steps.playwright-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Delete stale Playwright browser caches
        if: steps.playwright-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          currentKey="playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}"
          cacheIds=$(gh cache list --repo "${{ github.repository }}" --ref refs/heads/main \
            --key "playwright-fusion-v1-${{ runner.os }}-${{ runner.arch }}-" --limit 100 \
            --json id,key,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[2:] | .[] | select(.key != \"$currentKey\") | .id")
          for id in $cacheIds; do
            echo "Deleting stale Playwright browser cache $id"
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done

      # Cache keys are immutable, so every lockfile change saves a brand-new
      # store on top of the previous one and old package versions never get
      # dropped. Pruning here keeps the saved cache scoped to what this
      # lockfile actually needs instead of growing unbounded.
      - name: Prune pnpm store
        if: steps.pnpm-store-restore.outputs.cache-hit != 'true'
        run: pnpm store prune

      - name: Save pnpm store
        if: steps.pnpm-store-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-fusion-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Cache keys are immutable, so every save creates a brand-new entry
      # instead of replacing the previous one — old pnpm-store entries for
      # main never get evicted by anything but GitHub's 10GB LRU quota.
      # Delete them here, keeping a couple of recent fallbacks so an
      # in-flight workflow always finds a cache to restore from.
      - name: Delete stale pnpm store caches
        if: steps.pnpm-store-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          currentKey="pnpm-store-fusion-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          cacheIds=$(gh cache list --repo "${{ github.repository }}" --ref refs/heads/main \
            --key "pnpm-store-fusion-v1-${{ runner.os }}-" --limit 100 \
            --json id,key,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[2:] | .[] | select(.key != \"$currentKey\") | .id")
          for id in $cacheIds; do
            echo "Deleting stale pnpm store cache $id"
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done
