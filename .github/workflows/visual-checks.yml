name: Visual checks

on:
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - ".changeset/**"
      - "vue-press/**"
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit SHA to validate
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: number

concurrency:
  group: visual-checks-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number }}
  # Bot pushes (e.g. the release PR) start as `action_required` runs; approving them re-runs the same
  # commit around the time the PR is marked ready. Only fresh runs cancel, so those same-commit runs
  # queue instead of cancelling each other and leaving a failed required check on the PR.
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' && github.run_attempt == '1' }}

permissions:
  actions: read
  contents: read
  # Dispatched runs look up the pull request to find the Turbo cache for its base commit.
  pull-requests: read

jobs:
  playwright:
    name: Playwright (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ignoreSnapshots: false
          - os: windows-latest
            ignoreSnapshots: true
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PLAYWRIGHT_IGNORE_SNAPSHOTS: ${{ matrix.ignoreSnapshots }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup node and install deps
        uses: $/.github/actions/node-setup
        with:
          cache-node-modules: "true"
          # The shared Turbo producer runs only on Linux; Windows builds fresh.
          cache-turbo: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          wait-for-turbo-cache: "true"

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-fusion-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @equinor/fusion-framework-vitest-plugin-react-app exec playwright install chromium

      - name: Build Playwright dependencies
        shell: bash
        run: pnpm turbo run build --filter='./packages/**'

      # Each suite starts its own app build, dev server, mock server, and browser. Running them
      # side by side starved the runners, so apps took longer to load than the tests wait for.
      - name: Run Playwright checks
        shell: bash
        run: pnpm turbo run test:playwright --concurrency=1

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            cookbooks/*/playwright/.results/
            cookbooks/*/playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  required-check:
    name: Visual checks
    if: always() && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    needs:
      - playwright
    runs-on: ubuntu-latest
    steps:
      - name: Verify visual checks passed
        env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: |
          if [[ "$PLAYWRIGHT_RESULT" != "success" ]]; then
            echo "Playwright checks did not pass: $PLAYWRIGHT_RESULT"
            exit 1
          fi
